version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfred_backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: alfred_nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
