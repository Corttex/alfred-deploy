version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfred_backend
    restart: always
    env_file:
      - ./backend/.env
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: alfred_nginx
    restart: always
    depends_on:
      - backend

